workflows:
  ios-free-sideload:
    name: iOS Free Sideload IPA Artifact
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feature/*"
          include: true
          source: true
        - pattern: "main"
          include: true
          source: true
        - pattern: "master"
          include: true
          source: true
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: ios
        XCODE_SCHEME: LongScreenshotApp
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          brew install xcodegen
      - name: Run cloud tests
        script: |
          set -euo pipefail
          cd cloud
          python3 -m pip install -e '.[test]'
          pytest -q
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$XCODE_PROJECT_DIR"
          xcodegen generate
      - name: Run shared Swift tests
        script: |
          set -euo pipefail
          cd "$XCODE_PROJECT_DIR"
          SIMCTL_RUNTIMES_JSON=$(mktemp)
          SIMCTL_DEVICE_TYPES_JSON=$(mktemp)
          trap 'rm -f "$SIMCTL_RUNTIMES_JSON" "$SIMCTL_DEVICE_TYPES_JSON"; if [ -n "${SIM_UDID:-}" ]; then xcrun simctl delete "$SIM_UDID" >/dev/null 2>&1 || true; fi' EXIT
          xcrun simctl list runtimes iOS --json > "$SIMCTL_RUNTIMES_JSON"
          xcrun simctl list devicetypes --json > "$SIMCTL_DEVICE_TYPES_JSON"
          RUNTIME_ID=$(python3 - "$SIMCTL_RUNTIMES_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              runtimes = [
                  runtime for runtime in json.load(file)["runtimes"]
                  if runtime.get("isAvailable") and runtime.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")
              ]
          if not runtimes:
              raise SystemExit("No available iOS simulator runtime found")
          runtimes.sort(key=lambda runtime: [int(part) for part in runtime.get("version", "0").split(".")])
          print(runtimes[-1]["identifier"])
          PY
          )
          DEVICE_TYPE_ID=$(python3 - "$SIMCTL_DEVICE_TYPES_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              device_types = json.load(file)["devicetypes"]
          by_name = {device_type["name"]: device_type["identifier"] for device_type in device_types}
          for name in ["iPhone 16", "iPhone 15", "iPhone 14", "iPhone 13"]:
              if name in by_name:
                  print(by_name[name])
                  break
          else:
              for device_type in device_types:
                  if device_type["name"].startswith("iPhone"):
                      print(device_type["identifier"])
                      break
              else:
                  raise SystemExit("No iPhone simulator device type found")
          PY
          )
          SIM_UDID=$(xcrun simctl create LongScreenshotTestSimulator "$DEVICE_TYPE_ID" "$RUNTIME_ID")
          xcodebuild test -scheme LongScreenshotShared -destination "id=$SIM_UDID"
      - name: Build unsigned app bundle
        script: |
          set -euo pipefail
          cd "$XCODE_PROJECT_DIR"
          xcodebuild build \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Package sideload IPA artifact
        script: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData -path '*/Release-iphoneos/LongScreenshotApp.app' -type d | head -n 1)
          test -n "$APP_PATH"
          rm -rf build/ipa/Payload
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/LongScreenshot.app
          cd build/ipa
          zip -r LongScreenshot-unsigned.ipa Payload
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
