name: LongScreenshot
options:
  bundleIdPrefix: com.longscreenshot
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  LongScreenshotShared:
    type: framework
    platform: iOS
    sources:
      - LongScreenshotShared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.longscreenshot.free.shared
      GENERATE_INFOPLIST_FILE: YES
  LongScreenshotSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LongScreenshotSharedTests
    dependencies:
      - target: LongScreenshotShared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.longscreenshot.free.sharedTests
      GENERATE_INFOPLIST_FILE: YES
  LongScreenshotBroadcastUploadExtension:
    type: app-extension
    platform: iOS
    sources:
      - LongScreenshotBroadcastUploadExtension
    info:
      path: LongScreenshotBroadcastUploadExtension/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.longscreenshot.free.broadcast
      APPLICATION_EXTENSION_API_ONLY: YES
  LongScreenshotApp:
    type: application
    platform: iOS
    sources:
      - LongScreenshotApp
    dependencies:
      - target: LongScreenshotShared
      - target: LongScreenshotBroadcastUploadExtension
        embed: true
    info:
      path: LongScreenshotApp/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.longscreenshot.free
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  LongScreenshotShared:
    build:
      targets:
        LongScreenshotShared: all
    test:
      targets:
        - LongScreenshotSharedTests
  LongScreenshotApp:
    build:
      targets:
        LongScreenshotApp: all
        LongScreenshotBroadcastUploadExtension: all
